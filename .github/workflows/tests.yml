name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Python 3.11 / offscreen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-hu.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2t64 libdbus-1-3 libegl1 libgl1 libglib2.0-0t64 \
            libopengl0 libpulse0 libxcb-cursor0 libxkbcommon0

      - name: Install Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-hu.txt

      - name: Verify desktop and video dependencies
        # Fail on missing extras instead of silently skipping the UI tests.
        run: |
          python - <<'PY'
          import av
          import PIL
          from PySide6 import QtCore, QtGui, QtMultimedia, QtWidgets
          from hu_lab import desktop

          app = QtWidgets.QApplication([])
          assert app.platformName() == "offscreen"
          av.CodecContext.create("libx264", "w")
          print("Qt", QtCore.qVersion(), "PyAV", av.__version__, "Pillow", PIL.__version__)
          PY

      - name: Run unit and loopback integration tests
        # USB is mocked; DemoPeer uses localhost and generated video/audio.
        run: python -m unittest discover -s tests -v
