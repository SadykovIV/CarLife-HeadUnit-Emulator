name: Windows packaged release check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose Windows ZIP should be tested
        required: true
        default: v0.5.1
        type: string
      expected_sha256:
        description: Expected SHA256 of the complete Windows ZIP
        required: true
        type: string
      package_version:
        description: Version inside the ZIP when staging under a different draft tag
        required: false
        type: string
      usb_regressions:
        description: Run USB reconnect tests from the dispatched source commit against the extracted package
        type: boolean
        default: false

permissions: {}

jobs:
  windows-package:
    name: Windows 2025 / packaged x64 runtime
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      # Draft releases are visible only to push-authorized identities. This
      # manual workflow only reads release assets; it never edits a release.
      # https://docs.github.com/en/rest/releases/releases#list-releases
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      PACKAGE_VERSION: ${{ inputs.package_version }}

    steps:
      - name: Validate inputs and prepare isolated directories
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $versionPattern = '(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-rc\.[1-9][0-9]*)?'
          if ($env:RELEASE_TAG -cnotmatch "\Av${versionPattern}\z") {
            throw 'Tag must have the form vX.Y.Z or vX.Y.Z-rc.N.'
          }
          if ($env:EXPECTED_SHA256 -notmatch '\A[0-9a-fA-F]{64}\z') {
            throw 'Expected SHA256 must be exactly 64 hexadecimal characters.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          if (-not [string]::IsNullOrEmpty($env:PACKAGE_VERSION)) {
            if ($env:PACKAGE_VERSION -cnotmatch "\A${versionPattern}\z") { throw 'Invalid package version.' }
            $version = $env:PACKAGE_VERSION
          }
          $name = "CarLife-HeadUnit-Emulator-$version-Windows-x64"
          $work = Join-Path $env:RUNNER_TEMP 'headunit-release-check'
          $smoke = Join-Path $env:RUNNER_TEMP 'headunit-smoke'
          New-Item -ItemType Directory -Path "$work/download", "$work/unpacked", "$work/logs", "$work/temp", "$work/localappdata", $smoke | Out-Null
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "ASSET_NAME=$name.zip" >> $env:GITHUB_ENV
          "CHECK_ROOT=$work" >> $env:GITHUB_ENV
          "PACKAGE_ROOT=$work/unpacked/$name" >> $env:GITHUB_ENV
          "SMOKE_ROOT=$smoke" >> $env:GITHUB_ENV

      - name: Download release asset, verify SHA256 and extract the whole package
        timeout-minutes: 3
        env:
          # Keep the token out of the application process environment.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-StrictMode -Version Latest
          & gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET_NAME --dir "$env:CHECK_ROOT/download"
          if ($LASTEXITCODE -ne 0) { throw "Release download failed: exit $LASTEXITCODE" }
          $archive = Join-Path "$env:CHECK_ROOT/download" $env:ASSET_NAME
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:EXPECTED_SHA256.ToLowerInvariant()) {
            throw "SHA256 mismatch: expected $env:EXPECTED_SHA256, got $actual"
          }
          "Asset: $env:ASSET_NAME`nSHA256: $actual" | Set-Content "$env:CHECK_ROOT/logs/asset.log" -Encoding utf8
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:CHECK_ROOT/unpacked"
          foreach ($relative in @('CarLifeHeadUnitEmulator.exe', 'Verify.cmd', 'runtime/pythonw.exe', 'build-info.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:PACKAGE_ROOT $relative) -PathType Leaf)) {
              throw "Missing package file: $relative"
            }
          }
          $build = Get-Content -LiteralPath "$env:PACKAGE_ROOT/build-info.json" -Raw | ConvertFrom-Json
          if ($build.version -ne $env:RELEASE_VERSION -or $build.architecture -ne 'x64') {
            throw 'The packaged version or architecture does not match the requested release.'
          }
          # The USB runtime probe was introduced in 0.3.2-rc.1.
          $needsUsbProbe = ([version](($env:RELEASE_VERSION -split '-')[0])) -ge [version]'0.3.2'
          if ($needsUsbProbe -and -not (Test-Path -LiteralPath "$env:PACKAGE_ROOT/VerifyUsbRuntime.cmd" -PathType Leaf)) {
            throw 'The release is missing its USB runtime probe.'
          }
          "CHECK_USB_RUNTIME=$($needsUsbProbe.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Run Verify.cmd with the bundled interpreter and DLLs
        # Start-Process -Wait waits for the launcher and its Python child.
        # The step timeout bounds the entire process tree if either hangs.
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $env:TEMP = "$env:CHECK_ROOT/temp"
          $env:TMP = $env:TEMP
          $env:LOCALAPPDATA = "$env:CHECK_ROOT/localappdata"
          try {
            $process = Start-Process -FilePath $env:ComSpec -ArgumentList '/d /s /c Verify.cmd' -WorkingDirectory $env:PACKAGE_ROOT -Wait -PassThru -RedirectStandardOutput "$env:CHECK_ROOT/logs/verify.stdout.log" -RedirectStandardError "$env:CHECK_ROOT/logs/verify.stderr.log"
            if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) {
              throw "Verify.cmd failed: exit $($process.ExitCode)"
            }
            $check = Get-Content -LiteralPath "$env:TEMP/carlife-bundle-check.json" -Raw | ConvertFrom-Json
            if ($check.status -ne 'PASS' -or $check.platform -ne 'win32' -or $check.portable -ne $true -or $check.architecture -notmatch '^(AMD64|x86_64)$') {
              throw 'Packaged Windows import/native-library verification failed.'
            }
            if ($check.h264_decoder -ne 'available' -or $check.demo_encoder -ne 'libx264') {
              throw 'Required H.264 decoder or demo encoder is unavailable.'
            }
          } finally {
            $startup = Join-Path $env:LOCALAPPDATA 'CarLife HeadUnit/startup-error.txt'
            if (Test-Path -LiteralPath $startup) {
              Copy-Item -LiteralPath $startup -Destination "$env:CHECK_ROOT/logs/verify-startup.log"
            }
          }

      - name: Check packaged USB libraries without opening a device
        if: env.CHECK_USB_RUNTIME == 'true'
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $env:TEMP = "$env:CHECK_ROOT/temp"
          $env:TMP = $env:TEMP
          $env:LOCALAPPDATA = "$env:CHECK_ROOT/localappdata"
          $process = Start-Process -FilePath $env:ComSpec -ArgumentList '/d /s /c VerifyUsbRuntime.cmd' -WorkingDirectory $env:PACKAGE_ROOT -Wait -PassThru -RedirectStandardOutput "$env:CHECK_ROOT/logs/usb-runtime.stdout.log" -RedirectStandardError "$env:CHECK_ROOT/logs/usb-runtime.stderr.log"
          if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) {
            throw "VerifyUsbRuntime.cmd failed: exit $($process.ExitCode)"
          }
          $check = Get-Content -LiteralPath "$env:TEMP/carlife-libusb-check.json" -Raw | ConvertFrom-Json
          $build = Get-Content -LiteralPath "$env:PACKAGE_ROOT/build-info.json" -Raw | ConvertFrom-Json
          if ($check.status -ne 'PASS' -or $check.stage -ne 'complete' -or $check.package_version -ne $env:RELEASE_VERSION -or $check.platform -ne 'win32') {
            throw 'USB runtime probe did not complete for this Windows release.'
          }
          if ($check.library_sha256 -ne $build.usb_library.sha256 -or $check.library_version -ne $build.usb_library.version -or $check.resolved_exports -ne @($build.usb_library.required_exports).Count) {
            throw 'The loaded USB library differs from the packaged manifest.'
          }
          if ($check.context_initialized -ne $true -or $check.context_closed -ne $true -or $null -eq $check.device_count -or $check.device_count -lt 0 -or $check.device_open_attempted -ne $false -or $check.interface_claim_attempted -ne $false -or $check.aoa_request_attempted -ne $false) {
            throw 'The probe did not enumerate and close the context within its read-only scope.'
          }
          if ($null -ne $build.PSObject.Properties['driver_setup_helper']) {
            $helper = Join-Path $env:PACKAGE_ROOT 'CarLifeWinUsbSetup.exe'
            if ($build.driver_setup_helper.name -cne 'CarLifeWinUsbSetup.exe' -or (Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash -ne $build.driver_setup_helper.sha256) {
              throw 'Driver helper hash or filename differs from the manifest.'
            }
            # This exact argument binds system APIs and exits before target
            # parsing; do not request elevation or run an installation mode.
            $process = Start-Process -FilePath $helper -ArgumentList '--verify-api' -WorkingDirectory $env:PACKAGE_ROOT -Wait -PassThru
            if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) {
              throw "Native helper API check failed: exit $($process.ExitCode)"
            }
            'Native helper API check: PASS (no device or install).' | Set-Content "$env:CHECK_ROOT/logs/helper-api.log" -Encoding utf8
          }

      - name: Check out USB regression tests from the dispatched commit
        if: inputs.usb_regressions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests

      - name: Run USB reconnect and WinUSB tests with packaged Python
        if: inputs.usb_regressions
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:CHECK_ROOT 'usb-regressions.py'
          @'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import unittest

          import hu_lab

          package = Path(os.environ['PACKAGE_ROOT']).resolve()
          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if Path(hu_lab.__file__).resolve() != package / 'hu_lab' / '__init__.py':
              raise RuntimeError('The USB tests must import the extracted release package')
          sys.path.insert(0, str(checkout))
          import tests
          if Path(tests.__file__).resolve() != checkout / 'tests' / '__init__.py':
              raise RuntimeError('The USB tests must come from the dispatched commit')
          # Check the packaged implementation against Git objects. Sparse
          # checkout deliberately leaves the source modules off sys.path.
          tree = subprocess.check_output(
              ['git', 'ls-tree', '-r', 'HEAD', 'hu_lab'], cwd=checkout, text=True)
          for entry in tree.splitlines():
              metadata, filename = entry.split('\t', 1)
              if filename.endswith('.py'):
                  data = (package / filename).read_bytes()
                  blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data)
                  if blob.hexdigest() != metadata.split()[2]:
                      raise RuntimeError(f'Dispatched USB tests and packaged source differ: {filename}')

          modules = ('test_usb_reselection', 'test_usb_claim_wait', 'test_desktop_session',
                     'test_windows_usb_interfaces', 'test_windows_winusb')
          suite = unittest.defaultTestLoader.loadTestsFromNames(['tests.' + name for name in modules])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or not result.testsRun:
              raise SystemExit(1)
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          & "$env:PACKAGE_ROOT/runtime/python.exe" -X utf8 $script *> "$env:CHECK_ROOT/logs/usb-regressions.log"
          $result = $LASTEXITCODE
          Get-Content -LiteralPath "$env:CHECK_ROOT/logs/usb-regressions.log"
          if ($result -ne 0) { throw "Packaged USB regressions failed: exit $result" }

      - name: Run the packaged GUI demo and require clean shutdown
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $env:TEMP = "$env:CHECK_ROOT/temp"
          $env:TMP = $env:TEMP
          $env:LOCALAPPDATA = "$env:CHECK_ROOT/localappdata"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $arguments = "--demo --smoke-test 8 --data-dir `"$env:SMOKE_ROOT`""
          try {
            $process = Start-Process -FilePath "$env:PACKAGE_ROOT/CarLifeHeadUnitEmulator.exe" -ArgumentList $arguments -WorkingDirectory $env:PACKAGE_ROOT -Wait -PassThru -RedirectStandardOutput "$env:CHECK_ROOT/logs/demo.stdout.log" -RedirectStandardError "$env:CHECK_ROOT/logs/demo.stderr.log"
            if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) {
              throw "Packaged GUI demo failed: exit $($process.ExitCode)"
            }
            $report = Get-Content -LiteralPath "$env:SMOKE_ROOT/smoke-report.json" -Raw | ConvertFrom-Json
            if ($report.version -ne $env:RELEASE_VERSION -or $report.decoded_frames -le 0) {
              throw 'The requested version did not decode demo frames.'
            }
            if ($report.error -or $report.demo_error -or @($report.workers_alive).Count -ne 0 -or @($report.desktop_cleanup_errors).Count -ne 0) {
              throw 'The demo reported an error or did not stop all workers cleanly.'
            }
            if (-not (Test-Path -LiteralPath "$env:SMOKE_ROOT/smoke-window.png" -PathType Leaf)) {
              throw 'The packaged GUI did not create its smoke screenshot.'
            }
            "Windows packaged demo PASS: $($report.decoded_frames) frames; clean exit 0." | Tee-Object -FilePath "$env:CHECK_ROOT/logs/result.log"
          } finally {
            $startup = Join-Path $env:LOCALAPPDATA 'CarLife HeadUnit/startup-error.txt'
            if (Test-Path -LiteralPath $startup) {
              Copy-Item -LiteralPath $startup -Destination "$env:CHECK_ROOT/logs/demo-startup.log"
            }
          }

      - name: Upload only this run's smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packaged-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/headunit-smoke/smoke-report.json
            ${{ runner.temp }}/headunit-smoke/smoke-window.png
            ${{ runner.temp }}/headunit-release-check/logs/*.log
            ${{ runner.temp }}/headunit-release-check/temp/carlife-libusb-check.json
